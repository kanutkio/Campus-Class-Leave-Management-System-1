<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校園請假管理系統</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-light: #eff6ff;
            --success-color: #16a34a;
            --success-light: #f0fdf4;
            --danger-color: #dc2626;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #475569;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 12px rgba(0, 0, 0.08);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0.1);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --transition-base: all 0.25s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "PingFang TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 820px;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 28px;
            margin-bottom: 28px;
            font-weight: 700;
        }

        /* 管理員密碼區塊 */
        .admin-login {
            background: var(--card-bg);
            padding: 16px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }
        .admin-login input {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            width: 180px;
        }
        .admin-login button {
            padding: 8px 16px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--primary-color);
            color: #fff;
            cursor: pointer;
            transition: var(--transition-base);
        }
        .admin-login button:hover {
            background: #1d4ed8;
        }

        /* 表單區塊 */
        .form-section {
            background: var(--card-bg);
            padding: 24px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            margin-bottom: 24px;
            transition: var(--transition-base);
        }

        .form-section:hover {
            box-shadow: var(--shadow-lg);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--text-sub);
            font-size: 15px;
        }

        input, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 16px;
            background-color: #fefefe;
            transition: var(--transition-base);
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        button.btn-submit {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            transition: var(--transition-base);
        }

        button.btn-submit:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(37, 99, 235, 0.25);
        }

        button.btn-submit:active {
            transform: translateY(0);
        }

        /* 搜尋 + 篩選區塊 */
        .filter-section {
            margin-bottom: 24px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            align-items: center;
            padding: 12px;
            background: var(--card-bg);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
        }

        .search-input {
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            outline: none;
            font-size: 14px;
            width: 240px;
            transition: var(--transition-base);
        }

        .search-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .filter-btn {
            padding: 9px 18px;
            border: 1px solid var(--primary-color);
            background: transparent;
            color: var(--primary-color);
            border-radius: 999px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition-base);
        }

        .filter-btn.active {
            background: var(--primary-color);
            color: white;
        }

        .filter-btn:hover:not(.active) {
            background: var(--primary-light);
        }

        /* 資料視覺化 - 統計圖卡片 */
        .chart-wrapper {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            margin-bottom: 24px;
            text-align: center;
        }

        .chart-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 12px;
        }

        #statusChart {
            max-width: 220px;
            height: 220px;
        }

        /* 請假紀錄卡片列表 */
        .record-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .card {
            background: var(--card-bg);
            padding: 22px;
            border-radius: var(--radius-md);
            border-left: 6px solid var(--primary-color);
            box-shadow: var(--shadow-sm);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            transition: var(--transition-base);
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .card.status-done {
            border-left-color: var(--success-color);
            background-color: var(--success-light);
            opacity: 0.92;
        }

        .card-content h3 {
            margin: 0 0 12px 0;
            font-size: 19px;
            font-weight: 600;
        }

        .card-info {
            font-size: 14.5px;
            color: var(--text-sub);
            line-height: 1.7;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: var(--radius-sm);
            font-size: 12.5px;
            font-weight: 600;
            margin-top: 12px;
        }

        .badge-active { 
            background: var(--primary-light); 
            color: var(--primary-color); 
        }
        .badge-done { 
            background: var(--success-light); 
            color: var(--success-color); 
        }

        .card-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-toggle {
            padding: 7px 14px;
            border: 1px solid var(--border-color);
            background: white;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13.5px;
            color: var(--text-sub);
            transition: var(--transition-base);
        }

        .btn-toggle:hover {
            background-color: var(--bg-color);
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .empty-msg {
            text-align: center;
            color: var(--text-muted);
            margin-top: 60px;
            font-size: 16px;
            padding: 30px;
            background: var(--card-bg);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
        }

        /* 手機響應式适配 */
        @media (max-width: 576px) {
            h1 {
                font-size: 24px;
            }
            .form-section, .card {
                padding: 18px;
            }
            .card {
                flex-direction: column;
            }
            .card-actions {
                width: 100%;
                margin-top: 16px;
            }
            .search-input {
                width: 100%;
                max-width: 280px;
            }
            .filter-section {
                gap: 8px;
            }
            .filter-btn {
                padding: 8px 14px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>校園請假管理系統</h1>

    <!-- 管理員密碼驗證區 -->
    <div class="admin-login">
        <input type="password" id="adminPwd" placeholder="管理員密碼">
        <button onclick="checkAdmin()">驗證管理員</button>
        <span id="adminTip" style="color:var(--text-muted);font-size:14px;"></span>
    </div>

    <section class="form-section">
        <form id="leaveForm">
            <div class="form-group">
                <label for="studentId">學號 *</label>
                <input type="text" id="studentId" placeholder="例如: B11001001" required>
            </div>
            <div class="form-group">
                <label for="studentName">學生姓名 *</label>
                <input type="text" id="studentName" placeholder="例如: 王小明" required>
            </div>
            <div class="form-group">
                <label for="leaveReason">請假原因</label>
                <textarea id="leaveReason" rows="2" placeholder="請輸入請假事由..."></textarea>
            </div>
            <button type="submit" class="btn-submit">送出申請</button>
        </form>
    </section>

    <!-- 資料視覺化 - 狀態統計餅圖 -->
    <div class="chart-wrapper">
        <div class="chart-title">請假單狀態統計</div>
        <canvas id="statusChart"></canvas>
    </div>

    <section class="filter-section">
        <input type="text" class="search-input" id="searchInput" placeholder="輸入姓名/學號進行搜尋">
        
        <button class="filter-btn active" onclick="handleFilter('all', this)">全部</button>
        <button class="filter-btn" onclick="handleFilter('active', this)">審核中 (Active)</button>
        <button class="filter-btn" onclick="handleFilter('done', this)">已完成 (Done)</button>
    </section>

    <div id="recordList" class="record-list">
        </div>
</div>

<script>
    // ========== 權限設定 ==========
    const ADMIN_PASSWORD = "123456"; // 自行修改為你的專屬密碼
    let isAdmin = false; // 預設非管理員，隱藏狀態切換按鈕

    // --- 全域變數 ---
    const STORAGE_KEY = 'records';
    let currentFilter = 'all';

    // --- Google Sheet Backend Config ---
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxJwb-UHcXg6IiEBeAqaBtlhZ6li3wohs55yXBAg5GD8JRw8k98ltfBkNWI53RjM4zn/exec";

    // --- Sheet 同步函式 ---
    async function syncToSheet(payload) {
        try {
            const response = await fetch(APPS_SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(payload)
            });
            return await response.json();
        } catch (err) {
            console.warn("同步到 Google Sheet 失敗（使用離線模式）", err);
            return { ok: false, error: "網路異常" };
        }
    }

    async function fetchRecordsFromSheet() {
        try {
            const response = await fetch(APPS_SCRIPT_URL);
            const data = await response.json();
            if (data.ok && Array.isArray(data.records)) {
                return data.records.map(record => normalizeRecord(record));
            }
            return [];
        } catch (err) {
            console.warn("從 Google Sheet 讀取失敗", err);
            return null;
        }
    }

    function normalizeRecord(record) {
        return {
            id: record.ID || record.id || "",
            createdAt: record.CreatedAt || record.createdAt || "",
            status: record.Status || record.status || "active",
            studentId: record.StudentId || record.studentId || "",
            studentName: record.StudentName || record.studentName || "",
            leaveReason: record.LeaveReason || record.leaveReason || "無"
        };
    }

    // 管理員密碼驗證
    function checkAdmin() {
        const pwd = document.getElementById('adminPwd').value;
        const tip = document.getElementById('adminTip');
        if (pwd === ADMIN_PASSWORD) {
            isAdmin = true;
            tip.innerText = "✅ 管理員驗證成功，可操作狀態切換";
            tip.style.color = "#16a34a";
            applyFilterAndRender(); // 重新渲染顯示按鈕
        } else {
            isAdmin = false;
            tip.innerText = "❌ 密碼錯誤，僅可瀏覽";
            tip.style.color = "#dc2626";
            applyFilterAndRender(); // 重新渲染隱藏按鈕
        }
    }

    // --- 初始化 ---
    window.onload = async () => {
        await initApp();
    };

    async function initApp() {
        // 綁定搜尋輸入事件：**直接在畫面上隱藏/顯示卡片**
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', function () {
            const kw = this.value.trim().toLowerCase();
            const cards = document.querySelectorAll('.card');
            let hasAnyMatch = false;

            cards.forEach(card => {
                const name = card.querySelector('h3').textContent.toLowerCase();
                const id = name.split('(')[1]?.replace(')','') || '';
                if (kw === '' || name.includes(kw) || id.includes(kw)) {
                    card.style.display = 'flex';
                    hasAnyMatch = true;
                } else {
                    card.style.display = 'none';
                }
            });

            // 沒有任何匹配時顯示「無資料」
            const emptyMsg = document.querySelector('.empty-msg');
            if (!hasAnyMatch) {
                if (!emptyMsg) {
                    document.getElementById('recordList').innerHTML += '<p class="empty-msg">沒有匹配的請假紀錄</p>';
                }
            } else {
                if (emptyMsg) emptyMsg.remove();
            }
        });

        // 優先讀 Google Sheet，失敗 fallback localStorage
        let records = await fetchRecordsFromSheet();
        if (!records) {
            records = loadData();
        } else {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
        }
        
        renderList(records);
        drawStatusChart();

        // 表單監聽
        document.getElementById('leaveForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                studentId: document.getElementById('studentId').value,
                studentName: document.getElementById('studentName').value,
                leaveReason: document.getElementById('leaveReason').value
            };

            const newRecord = createRecord(formData);
            saveData(newRecord);
            
            await syncToSheet({ action: "create", record: newRecord });
            
            this.reset();
            applyFilterAndRender();
            drawStatusChart();
        });
    }

    // --- 資料函式 ---
    function createRecord(formData) {
        return {
            id: Date.now().toString(),
            createdAt: new Date().toISOString(),
            status: 'active',
            studentId: formData.studentId,
            studentName: formData.studentName,
            leaveReason: formData.leaveReason || '無'
        };
    }

    function saveData(record) {
        const records = loadData();
        records.push(record);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    function loadData() {
        const rawData = localStorage.getItem(STORAGE_KEY);
        return rawData ? JSON.parse(rawData) : [];
    }

    function renderList(recordsToShow) {
        const container = document.getElementById('recordList');
        container.innerHTML = '';

        if (recordsToShow.length === 0) {
            container.innerHTML = '<p class="empty-msg">目前無請假紀錄</p>';
            return;
        }

        recordsToShow.forEach(record => {
            const isDone = record.status === 'done';
            const dateStr = new Date(record.createdAt).toLocaleString();
            
            const card = document.createElement('div');
            card.className = `card ${isDone ? 'status-done' : ''}`;

            // 非管理員：不渲染狀態切換按鈕
            let actionHtml = "";
            if (isAdmin) {
                actionHtml = `
                    <div class="card-actions">
                        <button class="btn-toggle" onclick="toggleStatus('${record.id}')">
                            切換為 ${isDone ? '審核中' : '完成審核'}
                        </button>
                    </div>
                `;
            }
            
            card.innerHTML = `
                <div class="card-content">
                    <h3>${record.studentName} (${record.studentId})</h3>
                    <div class="card-info">
                        <div><strong>原因：</strong>${record.leaveReason}</div>
                        <div><strong>申請時間：</strong>${dateStr}</div>
                        <span class="status-badge ${isDone ? 'badge-done' : 'badge-active'}">
                            ${isDone ? '已完成審核' : '審核中'}
                        </span>
                    </div>
                </div>
                ${actionHtml}
            `;
            container.appendChild(card);
        });
    }

    async function updateRecord(id, changes) {
        const records = loadData();
        const index = records.findIndex(r => r.id === id);
        if (index !== -1) {
            records[index] = { ...records[index], ...changes };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
            await syncToSheet({ action: "update", id, changes });
        }
    }

    // --- UI 邏輯 ---
    async function toggleStatus(id) {
        // 二次權限攔截
        if (!isAdmin) return;
        const records = loadData();
        const target = records.find(r => r.id === id);
        if (target) {
            const newStatus = target.status === 'active' ? 'done' : 'active';
            await updateRecord(id, { status: newStatus });
            applyFilterAndRender();
            drawStatusChart();
        }
    }

    function handleFilter(filterType, btnElement) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
        currentFilter = filterType;
        applyFilterAndRender();
    }

    function applyFilterAndRender() {
        let records = loadData();
        records.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

        if (currentFilter !== 'all') {
            records = records.filter(r => r.status === currentFilter);
        }

        renderList(records);
        drawStatusChart();
    }

    // --- 餅圖統計 ---
    function drawStatusChart() {
        const records = loadData();
        const canvas = document.getElementById('statusChart');
        const ctx = canvas.getContext('2d');
        canvas.width = 220;
        canvas.height = 220;

        let activeCount = 0;
        let doneCount = 0;
        records.forEach(item => {
            if (item.status === 'active') activeCount++;
            else doneCount++;
        });

        const total = activeCount + doneCount;
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = 90;
        let startAngle = 0;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (activeCount > 0) {
            const activeRatio = activeCount / total;
            const activeAngle = Math.PI * 2 * activeRatio;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, startAngle, startAngle + activeAngle);
            ctx.closePath();
            ctx.fillStyle = '#2563eb';
            ctx.fill();
            startAngle += activeAngle;
        }

        if (doneCount > 0) {
            const doneRatio = doneCount / total;
            const doneAngle = Math.PI * 2 * doneRatio;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, startAngle, startAngle + doneAngle);
            ctx.closePath();
            ctx.fillStyle = '#16a34a';
            ctx.fill();
        }

        ctx.beginPath();
        ctx.arc(centerX, centerY, 40, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();

        ctx.fillStyle = '#1e293b';
        ctx.font = "bold 16px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(`總計: ${total}`, centerX, centerY - 8);
        ctx.font = "13px sans-serif";
        ctx.fillText(`審核中:${activeCount} 已完成:${doneCount}`, centerX, centerY + 12);
    }
</script>

</body>
</html>
